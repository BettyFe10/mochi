# Pubblica la web app su GitHub Pages ad ogni modifica, inserendo le chiavi dai Secrets.
# Impostazione una tantum: Settings → Pages → Source: "GitHub Actions"
# Le azioni sono fissate a un commit preciso: un aggiornamento malevolo dei tag non entra da solo.
name: Pubblica Mochi

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  pubblica:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Scarica il codice
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepara solo i file del sito
        # Elenco esplicito: tutto il resto (app nativa, Supabase, guide) non viene pubblicato
        run: |
          mkdir -p _site
          cp -R index.html app.js frasi.js privacy.html privacy.js config.js mascotte.js sw.js manifest.webmanifest icons vendor _site/
          ls -R _site | head -50

      - name: Inserisce le chiavi
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          REGISTRAZIONI_APERTE: ${{ vars.REGISTRAZIONI_APERTE }}
          TITOLARE_PRIVACY: ${{ secrets.TITOLARE_PRIVACY }}
          EMAIL_PRIVACY: ${{ secrets.EMAIL_PRIVACY }}
        run: node .github/scripts/crea-config.mjs _site/config.js

      - name: Configura Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Carica il sito
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

      - name: Pubblica
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
