# Progetto Xcode generato con XcodeGen:  brew install xcodegen  &&  xcodegen
# Il file Mochi.xcodeproj si rigenera da qui: le modifiche alla struttura vanno fatte in questo file.

name: Mochi

options:
  bundleIdPrefix: it.bettyfe
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  createIntermediateGroups: true

configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig

settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: $(MOCHI_TEAM_ID)
    CODE_SIGN_STYLE: Automatic

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: "2.20.0"

targets:
  Mochi:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - path: App
      - path: Shared
      - path: Resources/AppIcons.xcassets
      - path: Resources/Mascotte.xcassets
    dependencies:
      - package: Supabase
      - target: MochiWidget
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Mochi
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.productivity
        UILaunchScreen:
          UIColorName: AccentColor
        UIApplicationSupportsIndirectInputEvents: true
        ITSAppUsesNonExemptEncryption: false
        MochiAppGroup: $(MOCHI_APP_GROUP)
        SupabaseURL: $(SUPABASE_URL)
        SupabaseAnonKey: $(SUPABASE_ANON_KEY)
        WebAppURL: $(WEB_APP_URL)
    entitlements:
      path: App/Mochi.entitlements
      properties:
        com.apple.security.application-groups:
          - $(MOCHI_APP_GROUP)
    settings:
      base:
        PRODUCT_NAME: Mochi
        PRODUCT_BUNDLE_IDENTIFIER: $(MOCHI_BUNDLE_ID)
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: AppIcon-Nigi AppIcon-Bolla
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # Sandbox su Mac con accesso a internet (ignorati su iPhone)
        ENABLE_APP_SANDBOX: YES
        ENABLE_OUTGOING_NETWORK_CONNECTIONS: YES
        ENABLE_HARDENED_RUNTIME: YES

  MochiWidget:
    type: app-extension
    supportedDestinations: [iOS, macOS]
    sources:
      - path: Widget
      - path: Shared
      - path: Resources/Mascotte.xcassets
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: Mochi
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        MochiAppGroup: $(MOCHI_APP_GROUP)
    entitlements:
      path: Widget/MochiWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - $(MOCHI_APP_GROUP)
    settings:
      base:
        PRODUCT_NAME: MochiWidget
        PRODUCT_BUNDLE_IDENTIFIER: $(MOCHI_BUNDLE_ID).widget
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: YES
        ENABLE_APP_SANDBOX: YES
        ENABLE_HARDENED_RUNTIME: YES
