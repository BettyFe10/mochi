<!doctype html>
<html lang="it" data-stile="morbido">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Mochi</title>
<meta name="theme-color" content="#ffd6e4">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Mochi">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob:; connect-src 'self' https://*.supabase.co wss://*.supabase.co; object-src 'none'; base-uri 'none'; form-action 'self'">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/mochi.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="stylesheet" href="vendor/fonts/fonts.css">
<script src="config.js"></script>
<script src="mascotte.js"></script>
<script src="frasi.js"></script>
<style>
:root{
  --bg:#fff5f8; --bg2:#ffe9f0; --card:#ffffff; --ink:#4a2f3a; --ink2:#8a6a77; --line:#f6dbe5;
  --pink:#ff8fb1; --pink-d:#e85d8a; --pink-l:#ffe1eb; --salmon:#ff9e7a; --salmon-l:#ffe8de;
  --nori:#2f4a3a; --mint:#bfe8d4; --mint-d:#3f8f6a; --lav:#e5dcff; --lav-d:#7a62c9; --butter:#fff1c2;
  --acc-rgb:232,93,138; --recap1:#ffd6e4; --recap2:#ffe8de; --recap3:#fff1c2;
  --shadow:0 6px 20px rgba(var(--acc-rgb),.12); --r:22px;
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#2a1d24; --bg2:#33232c; --card:#3a2832; --ink:#ffe9f1; --ink2:#c9a9b7; --line:#4d3541;
    --pink-l:#57324a; --salmon-l:#56362c; --mint:#2f4b3f; --lav:#3c3456; --butter:#4f4630;
    --shadow:0 6px 20px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --bg:#2a1d24; --bg2:#33232c; --card:#3a2832; --ink:#ffe9f1; --ink2:#c9a9b7; --line:#4d3541;
  --pink-l:#57324a; --salmon-l:#56362c; --mint:#2f4b3f; --lav:#3c3456; --butter:#4f4630;
  --shadow:0 6px 20px rgba(0,0,0,.35);
}

/* ---------- Temi di colore (Fragola è quello di base, definito sopra) ---------- */
:root[data-palette="matcha"]{--pink:#7cc79a; --pink-d:#3f9a6b; --pink-l:#e3f5ea; --bg:#f4fbf6; --bg2:#e6f4ea; --line:#d6ecdd; --ink:#2f3f36; --ink2:#6b8576; --acc-rgb:63,154,107; --recap1:#d9f2e3; --recap2:#eef8e8; --recap3:#fff6d6; }
@media (prefers-color-scheme: dark){:root[data-palette="matcha"]:not([data-theme="light"]){--bg:#1c2620; --bg2:#232f28; --card:#2a382f; --line:#3a4c41; --pink-l:#2f4a3b; --ink:#e8f6ee; --ink2:#a6c2b2; }}
:root[data-palette="matcha"][data-theme="dark"]{--bg:#1c2620; --bg2:#232f28; --card:#2a382f; --line:#3a4c41; --pink-l:#2f4a3b; --ink:#e8f6ee; --ink2:#a6c2b2; }
:root[data-palette="lavanda"]{--pink:#b69cff; --pink-d:#7a5fd6; --pink-l:#ece6ff; --bg:#f8f5ff; --bg2:#efe9ff; --line:#e3dbfb; --ink:#3a3150; --ink2:#7d7396; --acc-rgb:122,95,214; --recap1:#e6ddff; --recap2:#f3e8ff; --recap3:#ffe8f3; --lav:#d4f0ec; --lav-d:#2f8f84;}
@media (prefers-color-scheme: dark){:root[data-palette="lavanda"]:not([data-theme="light"]){--bg:#211d2e; --bg2:#28233a; --card:#302a45; --line:#433b5c; --pink-l:#3d3460; --ink:#efeaff; --ink2:#b7add3; --lav:#24433f;}}
:root[data-palette="lavanda"][data-theme="dark"]{--bg:#211d2e; --bg2:#28233a; --card:#302a45; --line:#433b5c; --pink-l:#3d3460; --ink:#efeaff; --ink2:#b7add3; --lav:#24433f;}
:root[data-palette="pesca"]{--pink:#ffab7a; --pink-d:#e0703f; --pink-l:#ffe6d8; --bg:#fff7f2; --bg2:#ffeee3; --line:#f8dfd0; --ink:#4a3229; --ink2:#8c6e62; --acc-rgb:224,112,63; --recap1:#ffe0cc; --recap2:#ffefd9; --recap3:#fff5c8; }
@media (prefers-color-scheme: dark){:root[data-palette="pesca"]:not([data-theme="light"]){--bg:#2a1f1a; --bg2:#33261f; --card:#3b2c24; --line:#523d32; --pink-l:#5a3a2a; --ink:#ffeee5; --ink2:#cdb0a3; }}
:root[data-palette="pesca"][data-theme="dark"]{--bg:#2a1f1a; --bg2:#33261f; --card:#3b2c24; --line:#523d32; --pink-l:#5a3a2a; --ink:#ffeee5; --ink2:#cdb0a3; }
:root[data-palette="cielo"]{--pink:#7cc0f0; --pink-d:#3a86c8; --pink-l:#e1f1fd; --bg:#f4f9ff; --bg2:#e7f2fd; --line:#d5e7f7; --ink:#263a4c; --ink2:#6a8197; --acc-rgb:58,134,200; --recap1:#d8ecfc; --recap2:#e8f4ff; --recap3:#fdf2d6; }
@media (prefers-color-scheme: dark){:root[data-palette="cielo"]:not([data-theme="light"]){--bg:#1a222c; --bg2:#202a36; --card:#273342; --line:#38495c; --pink-l:#24405a; --ink:#e8f3ff; --ink2:#a8bcd0; }}
:root[data-palette="cielo"][data-theme="dark"]{--bg:#1a222c; --bg2:#202a36; --card:#273342; --line:#38495c; --pink-l:#24405a; --ink:#e8f3ff; --ink2:#a8bcd0; }
.palettes{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:4px 0 2px}
.palettes button{display:flex;flex-direction:column;align-items:center;gap:4px;border:0;background:none;padding:0;cursor:pointer;color:var(--ink2);font:inherit}
.palettes .sw{width:50px;height:50px;border-radius:50%;display:grid;place-items:center;font-size:26px;border:3px solid var(--card);box-shadow:0 0 0 2px var(--line);transition:transform .15s}
.palettes button.on .sw{box-shadow:0 0 0 3px var(--pink-d);transform:scale(1.06)}
.palettes small{font-size:11.5px;font-weight:700}
.palettes button.on small{color:var(--pink-d)}
.msg{background:var(--bg);border:2px solid var(--line);border-radius:18px;padding:12px 14px}
.msg.new{border-color:var(--pink);background:var(--card)}
.msg-h{display:flex;gap:10px;align-items:flex-start}
.msg-h .e{font-size:22px;line-height:1.2}
.msg-h small{display:block;color:var(--ink2);font-size:12px;word-break:break-all}
.msg-t{margin:8px 0 10px;white-space:pre-wrap;word-break:break-word}
.msg-stato{display:inline-block;margin:0 0 8px;padding:3px 10px;border-radius:999px;background:var(--pink-l);color:var(--pink-d);font-weight:800;font-size:12.5px}
.msg-risp{margin:0 0 8px;padding:10px 12px;border-radius:12px;background:var(--pink-l);white-space:pre-wrap;word-break:break-word;font-size:14px}
.msg-risp b{display:block;font-size:12px;color:var(--pink-d);margin-bottom:2px}
.msg-a{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.giorni{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.giorni button{padding:10px 0;border-radius:12px;border:2px solid var(--line);background:var(--bg);font-weight:800;color:var(--ink2)}
.giorni button.on{border-color:var(--pink-d);background:var(--pink-l);color:var(--pink-d)}
.lcard.ric.off{opacity:.6}
.pin-toggle.mini{width:auto;padding:0;border:0;background:none;flex:none}
.chip.lst{background:var(--lav);color:var(--lav-d);font-weight:800}
.lcard{background:var(--bg);border:2px solid var(--line);border-radius:18px;padding:12px 14px}
.lcard-h{display:flex;gap:10px;align-items:center;margin-bottom:8px}
.lcard-h .e{font-size:28px}
.lcard-h small{display:block;color:var(--ink2);font-size:12.5px}
.emojis{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.emojis button{font-size:24px;padding:8px 0;border-radius:14px;border:2px solid var(--line);background:var(--bg)}
.emojis button.on{border-color:var(--pink-d);background:var(--pink-l)}
.codice{font-family:ui-monospace,Menlo,monospace;font-size:22px;font-weight:800;letter-spacing:2px;text-align:center;background:var(--pink-l);color:var(--pink-d);border-radius:16px;padding:14px;user-select:all}
.setrow.col{flex-direction:column;align-items:stretch;gap:8px}
:root{--fb:Nunito,system-ui,sans-serif;--ft:Fredoka,Nunito,sans-serif}
/* ---------- Caratteri (Impostazioni > Carattere) ---------- */
:root[data-font="tondo"]{--fb:Quicksand,system-ui,sans-serif;--ft:Quicksand,system-ui,sans-serif}
:root[data-font="mano"]{--fb:'Patrick Hand',system-ui,sans-serif;--ft:'Patrick Hand',system-ui,sans-serif}
:root[data-font="mano"] body{font-size:17px;letter-spacing:.2px}
:root[data-font="pastello"]{--fb:Comfortaa,system-ui,sans-serif;--ft:Comfortaa,system-ui,sans-serif}
:root[data-font="leggibile"]{--fb:'Atkinson Hyperlegible',system-ui,sans-serif;--ft:'Atkinson Hyperlegible',system-ui,sans-serif}
:root[data-font="tondo"] :is(h1,h2,h3,.fred),:root[data-font="pastello"] :is(h1,h2,h3,.fred),:root[data-font="leggibile"] :is(h1,h2,h3,.fred){font-weight:700}
:root[data-font="sistema"]{--fb:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;--ft:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif}
.fonts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:4px}
.fonts button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 4px;border-radius:14px;border:2px solid var(--line);background:var(--bg);color:var(--ink)}
.fonts button .aa{font-size:24px;line-height:1.1}
.fonts button small{font-size:12px;color:var(--ink2);font-family:var(--fb)}
.fonts button.on{border-color:var(--pink-d);background:var(--pink-l)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--fb);font-size:16px}
body{min-height:100dvh;overscroll-behavior-y:none}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
.hidden{display:none!important}
h1,h2,h3,.fred{font-family:var(--ft);font-weight:600;margin:0}

/* ---------- mascotte animate ---------- */
.mascotte{display:block;width:100%;height:100%;overflow:visible}
.mascotte .eyes-happy,.mascotte .mouth-happy,.mascotte .eyes-closed{display:none}
.mascotte.happy .eyes,.mascotte.happy .mouth{display:none}
.mascotte.happy .eyes-happy,.mascotte.happy .mouth-happy{display:inline}
.mascotte .body{transform-box:fill-box;transform-origin:50% 100%;animation:breathe 3.4s ease-in-out infinite}
.mascotte .shadow{transform-box:fill-box;transform-origin:center;animation:shadow 3.4s ease-in-out infinite}
.mascotte .eye{transform-box:fill-box;transform-origin:center;animation:blink 4.6s infinite}
.mascotte .eye + .eye{animation-delay:.02s}
.mascotte .flower{transform-box:fill-box;transform-origin:50% 90%;animation:sway 3s ease-in-out infinite}
.mascotte .tail{transform-box:fill-box;transform-origin:0% 80%;animation:wag 1.4s ease-in-out infinite}
.mascotte.happy .body{animation:hop .55s cubic-bezier(.3,.7,.4,1.4) 3}
.mascotte.happy .flower{animation:sway .5s ease-in-out infinite}
.mascotte.happy .tail{animation:wag .35s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:translateY(0) scale(1,1)}50%{transform:translateY(-3%) scale(.985,1.02)}}
@keyframes shadow{0%,100%{transform:scale(1)}50%{transform:scale(.9)}}
@keyframes blink{0%,91%,97%,100%{transform:scaleY(1)}94%{transform:scaleY(.08)}}
@keyframes sway{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg)}}
@keyframes wag{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(10deg)}}
@keyframes hop{0%,100%{transform:translateY(0) scale(1,1)}25%{transform:translateY(0) scale(1.08,.9)}55%{transform:translateY(-16%) scale(.94,1.07)}80%{transform:translateY(0) scale(1.05,.95)}}
@media (prefers-reduced-motion: reduce){.mascotte *{animation:none!important}}
.heart{position:fixed;z-index:120;pointer-events:none;font-size:22px;animation:heart 1.1s ease-out forwards}
@keyframes heart{from{opacity:1;transform:translate(-50%,0) scale(.6)}to{opacity:0;transform:translate(-50%,-70px) scale(1.3)}}
.mpick{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.mpick button{background:var(--bg);border:3px solid var(--line);border-radius:22px;padding:12px 6px 10px;display:flex;flex-direction:column;align-items:center;gap:6px;transition:.2s}
.mpick button.on{border-color:var(--pink);background:var(--pink-l)}
.mpick .mbox{width:78px;height:72px}
.mpick b{font-family:var(--ft);font-size:16px}
.mpick small{font-size:11.5px;color:var(--ink2);line-height:1.3;text-align:center}

/* ---------- layout ---------- */
.app{max-width:760px;margin:0 auto;padding:calc(var(--safe-t) + 14px) 16px calc(var(--safe-b) + 110px)}
.top{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.top .mascot{width:62px;height:58px;flex:none;padding:0;filter:drop-shadow(0 4px 8px rgba(var(--acc-rgb),.25))}
@keyframes bob{50%{transform:translateY(-4px) rotate(-2deg)}}
.top .hello{flex:1;min-width:0}
.top .hello h1{font-size:24px;line-height:1.1}
.top .hello p{margin:2px 0 0;color:var(--ink2);font-size:14px}
.motto{display:block;background:none;border:0;padding:0;margin:5px 0 0;text-align:left;font-size:13.5px;font-style:italic;font-weight:700;color:var(--pink-d);cursor:pointer;line-height:1.35;transition:opacity .2s}
.motto:hover{opacity:.75}
.motto.swap{animation:motto .35s ease}
/* Header su telefono: in alto data e pulsanti, sotto mascotte e saluto grande, poi la frase del giorno */
@media (max-width:1023px){
  .top{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;column-gap:10px;row-gap:6px;align-items:center}
  .top .hello{display:contents}
  .top .hello p{grid-column:1/3;grid-row:1;margin:0;font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .top .iconbtn{grid-row:1}
  .top .mascot{grid-column:1;grid-row:2;width:52px;height:50px}
  .top .hello h1{grid-column:2/5;grid-row:2;font-size:clamp(22px,6.6vw,26px);line-height:1.1;overflow-wrap:anywhere}
  .top .motto{grid-column:1/5;grid-row:3;margin:0}
  :root[data-stile="quaderno"] .top .hello h1{font-size:clamp(26px,7.6vw,31px)}
}
@keyframes motto{from{opacity:0;transform:translateY(4px)}}
.iconbtn{width:42px;height:42px;border-radius:14px;background:var(--card);box-shadow:var(--shadow);display:grid;place-items:center;font-size:20px;flex:none}
.bubble{background:var(--card);border-radius:18px;padding:12px 14px;box-shadow:var(--shadow);font-size:14.5px;margin-bottom:16px;position:relative;border:2px solid var(--pink-l)}
.bubble b{color:var(--pink-d)}

/* ---------- nav ---------- */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:0 12px calc(var(--safe-b) + 10px);pointer-events:none}
.nav .bar{pointer-events:auto;max-width:520px;margin:0 auto;background:var(--card);border-radius:28px;box-shadow:0 10px 30px rgba(var(--acc-rgb),.22);display:grid;grid-template-columns:1fr 1fr 76px 1fr 1fr;align-items:center;height:68px;padding:0 6px}
.nav .tab{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;font-weight:700;color:var(--ink2);padding:8px 0;border-radius:18px}
.nav .tab .i{font-size:21px;line-height:1;filter:grayscale(.6);opacity:.75;transition:.2s}
.nav .tab.on{color:var(--pink-d)}
.nav .tab.on .i{filter:none;opacity:1;transform:scale(1.12)}
.nav .plus{width:62px;height:62px;margin:-26px auto 0;border-radius:22px;background:linear-gradient(145deg,var(--pink),var(--pink-d));color:#fff;font-size:34px;font-weight:700;box-shadow:0 10px 22px rgba(var(--acc-rgb),.45);display:grid;place-items:center;transition:transform .15s}
.nav .plus:active{transform:scale(.92)}


/* ---------- layout a due colonne (pagine Oggi e Agenda) ---------- */
.desk-only{display:none}
.desk-only-i{display:none}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mtile{display:flex;flex-direction:column;align-items:flex-start;gap:3px;text-align:left;padding:16px 14px;border-radius:20px;background:var(--card);box-shadow:var(--shadow);border:2px solid transparent;color:var(--ink)}
.mtile:active{transform:scale(.97)}
.mtile .e{font-size:28px;line-height:1.1;margin-bottom:4px}
.mtile b{font-size:15.5px}
.mtile small{font-size:12.5px;color:var(--ink2);line-height:1.3}
.split{display:block}
.split .col-side{margin-top:6px}



/* ---------- sections & cards ---------- */
.sec{margin:18px 0 8px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.sec h2{font-size:18px}
.sec .count{font-size:12.5px;font-weight:800;color:var(--pink-d);background:var(--pink-l);padding:3px 10px;border-radius:99px}
.list{display:flex;flex-direction:column;gap:9px}
.item{display:flex;align-items:flex-start;gap:12px;background:var(--card);border-radius:18px;padding:13px 14px;box-shadow:var(--shadow);border-left:5px solid var(--pink);transition:transform .15s, opacity .3s}
.item:active{transform:scale(.985)}
.item.lavoro{border-left-color:var(--lav-d)}
.item.personale{border-left-color:var(--pink)}
.item.done{opacity:.55}
.item.done .t{text-decoration:line-through}
.check{width:26px;height:26px;flex:none;border-radius:9px;border:2.5px solid var(--pink);display:grid;place-items:center;margin-top:1px;transition:.2s;background:var(--card)}
.item.lavoro .check{border-color:var(--lav-d)}
.item.done .check{background:var(--pink);border-color:var(--pink);color:#fff}
.item.done.lavoro .check{background:var(--lav-d);border-color:var(--lav-d)}
.evdot{width:26px;height:26px;flex:none;border-radius:9px;display:grid;place-items:center;background:var(--salmon-l);font-size:14px}
.body{flex:1;min-width:0}
.t{font-weight:700;line-height:1.3;word-wrap:break-word}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:5px;font-size:12.5px;color:var(--ink2);font-weight:600}
.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:99px;background:var(--bg2)}
.chip.late{background:#ffd9d9;color:#c0394e}
.chip.lav{background:var(--lav);color:var(--lav-d)}
.chip.per{background:var(--pink-l);color:var(--pink-d)}
.empty{text-align:center;padding:26px 16px;color:var(--ink2);font-size:14.5px}
.empty .mbox{width:92px;height:84px;margin:0 auto 6px}

.filters{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.fbtn{flex:none;padding:8px 14px;border-radius:99px;background:var(--card);font-weight:700;font-size:14px;box-shadow:var(--shadow);color:var(--ink2)}
.fbtn.on{background:var(--pink);color:#fff}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:6px}
.stat{background:var(--card);border-radius:18px;padding:12px;box-shadow:var(--shadow);text-align:center}
.stat b{display:block;font-family:var(--ft);font-size:26px;color:var(--pink-d);line-height:1.1}
.stat span{font-size:12px;color:var(--ink2);font-weight:700}

/* ---------- calendar ---------- */
.calhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.calhead h2{font-size:20px;text-transform:capitalize}
.cal{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:12px 8px}
.dow,.days{display:grid;grid-template-columns:repeat(7,1fr);text-align:center}
.dow div{font-size:11.5px;font-weight:800;color:var(--ink2);padding-bottom:6px}
.day{aspect-ratio:1/1;margin:2px;min-width:0;padding:0;-webkit-appearance:none;appearance:none;border-radius:14px;display:grid;place-items:center;text-align:center;font-weight:700;font-size:15px;line-height:1;position:relative;color:inherit;font-family:inherit}
.day.out{opacity:.3}
.day.today{background:var(--pink-l);color:var(--pink-d)}
.day.sel{background:var(--pink);color:#fff}
.day .dots{position:absolute;left:0;right:0;bottom:12%;display:flex;justify-content:center;gap:3px;height:5px}
.day .dots i{width:5px;height:5px;border-radius:50%;background:var(--salmon)}
.day .dots i.l{background:var(--lav-d)}
.day.sel .dots i{background:#fff}

/* ---------- notes ---------- */
.notes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px 12px;align-items:start}
@media(min-width:620px){.notes{grid-template-columns:repeat(3,minmax(0,1fr))}}
.note{margin:0;border-radius:18px;padding:14px;box-shadow:var(--shadow);background:var(--butter);color:#4a2f3a;position:relative}
.note.c1{background:#fff1c2}.note.c2{background:#ffd9e5}.note.c3{background:#d8f1e4}.note.c4{background:#e5dcff}.note.c5{background:#ffe2d3}
.note.c6{background:#d7ecff}.note.c7{background:#eaf6cf}.note.c8{background:#f6dcff}.note.c9{background:#ececf1}.note.c10{background:#ffd0c7}.note.c11{background:#c9f2ec}.note.c12{background:#efe3d0}
.note h3{font-size:16px;margin-bottom:6px}
.note p{margin:0;font-size:14px;white-space:pre-wrap;word-wrap:break-word;line-height:1.45}
.note .pin{position:absolute;top:8px;right:10px;font-size:14px}
.note .when{font-size:11.5px;opacity:.6;margin-top:8px;font-weight:700}

/* ---------- sheet ---------- */
.scrim{position:fixed;inset:0;background:rgba(74,47,58,.35);z-index:40;opacity:0;pointer-events:none;transition:.25s;backdrop-filter:blur(2px)}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:50;max-width:620px;margin:0 auto;background:var(--card);border-radius:28px 28px 0 0;padding:10px 18px calc(var(--safe-b) + 18px);transform:translateY(105%);transition:transform .32s cubic-bezier(.2,.9,.3,1.1);max-height:92dvh;overflow:auto;box-shadow:0 -10px 30px rgba(0,0,0,.12)}
.sheet.on{transform:none}
.grab{width:44px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 12px}
.sheet-x{position:sticky;top:0;margin:-22px -8px -14px auto;width:36px;height:36px;border-radius:50%;border:0;background:var(--pink-l);color:var(--ink2);font-size:16px;font-weight:800;cursor:pointer;z-index:2;display:grid;place-items:center}
.sheet-x:hover{color:var(--pink-d)}
/* Pancino della mascotte */
.mascotte .acc{pointer-events:none}
.pancino{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:var(--card);border:2px solid var(--pink-l);border-radius:20px;padding:10px 14px;margin:10px 0 4px;box-shadow:var(--shadow);cursor:pointer;color:inherit;font:inherit}
.pancino .mbox{width:62px;height:58px;flex:none}
.pc-txt{display:flex;flex-direction:column;gap:3px;min-width:0;flex:1}
.pc-txt b{font-size:15px}
.pc-txt small{color:var(--ink2);font-size:12.5px}
.pc-bar{display:block;height:9px;border-radius:9px;background:var(--pink-l);overflow:hidden;margin:3px 0 1px}
.pc-bar i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,var(--pink),var(--pink-d));transition:width .5s}
.week7{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;align-items:end;height:110px;margin-bottom:8px}
.week7 div{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:3px;font-size:11.5px;color:var(--ink2)}
.week7 i{display:block;width:70%;min-height:4px;border-radius:8px 8px 4px 4px;background:linear-gradient(180deg,var(--pink),var(--pink-d))}
.week7 b{font-size:12px;color:var(--ink)}
.regali{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.regali button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 6px;border-radius:16px;border:2px solid var(--line);background:var(--bg);color:inherit;font:inherit;cursor:pointer}
.regali button.on{border-color:var(--pink-d);background:var(--pink-l)}
.regali button .e{font-size:28px}
.regali button b{font-size:13px}
.regali button small{font-size:11px;color:var(--ink2);text-align:center}
.regali button.lock{opacity:.45;filter:grayscale(1);cursor:default}
.boccone{position:fixed;z-index:90;font-size:26px;pointer-events:none;transform:translate(0,0);transition:transform .62s cubic-bezier(.3,.1,.3,1),opacity .62s ease;margin:-14px 0 0 -14px}
#topMascot.nom .mascotte{animation:nom .6s ease}
@keyframes nom{0%,100%{transform:scale(1)}30%{transform:scale(1.15,.9)}60%{transform:scale(.95,1.08)}}
.sheet h2{font-size:20px;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.sheet h2 .mbox{width:40px;height:38px;flex:none}
.seg{display:flex;background:var(--bg2);border-radius:16px;padding:4px;gap:4px;margin-bottom:12px}
.seg button{flex:1;padding:8px 2px;border-radius:12px;font-weight:800;font-size:13px;color:var(--ink2);display:flex;flex-direction:column;align-items:center;gap:2px;white-space:nowrap}
.seg button .e{font-size:19px;line-height:1}
.seg button.on{background:var(--card);color:var(--pink-d);box-shadow:0 2px 8px rgba(0,0,0,.06)}
.field{margin-bottom:12px}
.field label{display:block;font-size:12.5px;font-weight:800;color:var(--ink2);margin:0 0 5px 4px}
.input,textarea.input,select.input{width:100%;padding:13px 14px;border-radius:16px;border:2px solid var(--line);background:var(--bg);outline:none;transition:border .2s;font-size:16px}
.input:focus{border-color:var(--pink)}
textarea.input{min-height:90px;resize:vertical}
.big{font-size:18px;font-weight:700}
.hint{font-size:12.5px;color:var(--ink2);margin:6px 4px 0;min-height:18px}
.hint b{color:var(--pink-d)}
.row{display:flex;gap:10px}
.row>*{flex:1;min-width:0}
.areas{display:flex;gap:8px}
.areas button{flex:1;padding:11px;border-radius:16px;border:2px solid var(--line);font-weight:800;font-size:14.5px}
.areas button.on.per{background:var(--pink-l);border-color:var(--pink);color:var(--pink-d)}
.areas button.on.lav{background:var(--lav);border-color:var(--lav-d);color:var(--lav-d)}
.colors{display:grid;grid-template-columns:repeat(6,1fr);gap:9px;max-width:380px}
.colors .note{width:auto;aspect-ratio:1/1;height:auto;margin:0;padding:0;box-shadow:none;border-radius:14px;border:3px solid transparent;break-inside:auto}
.colors .note.on{border-color:var(--ink);box-shadow:0 0 0 2px var(--card) inset}
.pin-toggle{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;border-radius:16px;border:2px solid var(--line);background:var(--bg);color:inherit;font:inherit;text-align:left;cursor:pointer}
.pin-toggle .e{font-size:22px;line-height:1}
.pin-toggle b{display:block;font-size:15px}
.pin-toggle small{display:block;color:var(--ink2);font-size:12.5px}
.pin-toggle .sw2{margin-left:auto;flex:none;width:44px;height:26px;border-radius:13px;background:var(--line);position:relative;transition:background .2s}
.pin-toggle .sw2::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:left .2s}
.pin-toggle.on{border-color:var(--pink)}
.pin-toggle.on .sw2{background:var(--pink-d)}
.pin-toggle.on .sw2::after{left:21px}
.actions{display:flex;gap:10px;margin-top:8px}
.btn{flex:1;padding:15px;border-radius:18px;font-weight:800;font-size:16px;background:var(--bg2);color:var(--ink)}
.btn.primary{background:linear-gradient(145deg,var(--pink),var(--pink-d));color:#fff;box-shadow:0 8px 18px rgba(var(--acc-rgb),.35)}
.btn.danger{flex:0 0 auto;padding:15px 18px;background:#ffe0e4;color:#c0394e}
.btn.danger-full{background:#d64a62;color:#fff;box-shadow:0 8px 18px rgba(214,74,98,.3)}
.more{font-size:14px;font-weight:800;color:var(--pink-d);padding:6px 4px;margin-bottom:6px}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 4px;border-bottom:1px solid var(--line)}
.setrow:last-child{border-bottom:0}
.setrow small{display:block;color:var(--ink2);font-size:12.5px}

/* ---------- login ---------- */
.login{min-height:100dvh;display:grid;place-items:center;padding:24px}
.login .box{width:100%;max-width:380px;text-align:center}
.login .mbox{width:150px;height:140px;margin:0 auto}
.login h1{font-size:30px;margin:10px 0 4px}
.login p{color:var(--ink2);margin:0 0 20px}
.login .input{margin-bottom:10px;text-align:left}
.pw{position:relative}
.pw .input{padding-right:50px}
.pw-eye{position:absolute;right:6px;top:4px;width:42px;height:42px;display:grid;place-items:center;border:0;background:none;color:var(--ink2);border-radius:12px;cursor:pointer}
.pw-eye:hover{color:var(--pink-d)}
.pw-eye[aria-pressed="true"]{color:var(--pink-d)}
.pw-eye[aria-pressed="true"] .eye-off{display:none}
.err{color:#c0394e;font-weight:700;font-size:14px;min-height:20px;margin:6px 0}

/* ---------- recap ---------- */
.recap{background:linear-gradient(160deg,var(--recap1),var(--recap2) 60%,var(--recap3));color:#4a2f3a;border-radius:26px;padding:18px;box-shadow:var(--shadow);text-align:center;position:relative;overflow:hidden}
.recap .mbox{width:110px;height:100px;margin:0 auto}
.recap h2{font-size:24px;margin:4px 0 2px}
.recap .say{font-size:15px;margin:6px 0 14px}
.recap .grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;text-align:left}
.recap .cell{background:rgba(255,255,255,.75);border-radius:18px;padding:12px}
.recap .cell b{font-family:var(--ft);font-size:28px;display:block;color:var(--pink-d);line-height:1.1}
.recap .cell span{font-size:12.5px;font-weight:800;opacity:.75}
.bar2{height:12px;border-radius:9px;background:var(--pink-l);overflow:hidden;display:flex;margin:6px 0}
.bar2 i{display:block;height:100%}
.legend{display:flex;justify-content:space-between;font-size:12.5px;font-weight:800;color:var(--ink2)}

/* ---------- misc ---------- */
.toast{position:fixed;left:50%;bottom:calc(var(--safe-b) + 96px);transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:16px;font-weight:700;font-size:14px;opacity:0;transition:.25s;z-index:80;pointer-events:none;max-width:90vw;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
body.sheet-open .toast{bottom:auto;top:calc(var(--safe-t) + 16px);transform:translate(-50%,-20px)}
body.sheet-open .toast.on{transform:translate(-50%,0)}
.sync{font-size:11.5px;font-weight:800;color:var(--ink2);display:inline-flex;align-items:center;gap:5px}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--mint-d)}
.sync.off i{background:#d9a441}
.conf{position:fixed;width:9px;height:12px;z-index:120;pointer-events:none;border-radius:2px;animation:fall 1s ease-out forwards}
@keyframes fall{to{transform:translate(var(--dx),var(--dy)) rotate(540deg);opacity:0}}
.view{animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}}
/* ---------- computer: barra laterale, colonne, pannelli centrati ---------- */
@media (min-width:1024px){
  .desk-only{display:block}
  .mob-only{display:none}
  .desk-only-i{display:grid}
  .nav .side{display:flex;align-items:center;gap:12px;padding:10px 14px;font-size:14.5px;font-weight:700;color:var(--ink2);border-radius:14px;text-align:left}
  .nav .side .i{font-size:18px}
  .nav .side:hover{background:var(--bg2)}
  .nav .side.on{background:var(--pink-l);color:var(--pink-d)}
  .nav .side.hidden{display:none}
  .nav .side-sep{height:1px;background:var(--line);margin:10px 8px}
  .nav{top:0;right:auto;bottom:0;width:248px;padding:24px 16px;pointer-events:auto;background:var(--card);box-shadow:4px 0 24px rgba(var(--acc-rgb),.08)}
  .nav .bar{display:flex;flex-direction:column;align-items:stretch;gap:6px;height:auto;padding:0;max-width:none;background:none;box-shadow:none;border-radius:0}
  .nav .brand{padding:4px 12px 18px}
  .nav .brand span{display:block;font-family:var(--ft);font-weight:700;font-size:26px;color:var(--pink-d);line-height:1.1}
  .nav .brand small{display:block;color:var(--ink2);font-weight:700;font-size:13px}
  .nav .plus{order:-1;width:100%;height:50px;margin:0 0 14px;border-radius:16px;font-size:16px;display:flex;align-items:center;justify-content:center;gap:8px}
  .nav .plus .pl{font-size:26px;line-height:1;margin-top:-3px}
  .nav .brand{order:-2}
  .nav .tab{flex-direction:row;justify-content:flex-start;gap:12px;padding:12px 14px;font-size:15.5px;border-radius:14px}
  .nav .tab .i{font-size:20px}
  .nav .tab.on{background:var(--pink-l)}
  .nav .tab:hover{background:var(--bg2)}
  .nav .tab.on .i{transform:none}
  .app{max-width:none;margin:0 0 0 248px;padding:32px clamp(28px,3vw,64px) 60px}
  .top{margin-bottom:22px}
  .top .hello h1{font-size:30px}
  .bubble{max-width:none}
  .split{display:grid;grid-template-columns:minmax(0,1fr) clamp(320px,24vw,460px);gap:clamp(28px,2.5vw,48px);align-items:start}
  .split .col-side{margin-top:0;position:sticky;top:24px}
  .split.agenda{grid-template-columns:minmax(0,1.35fr) minmax(320px,1fr)}
  .split.agenda .col-side .sec{margin-top:0}
  .split.agenda .day{font-size:17px;border-radius:16px}
  .cal.mini{padding:10px 6px}

  .sheet{top:50%;bottom:auto;left:calc(50% + 124px);right:auto;width:min(560px,calc(100vw - 296px));max-height:92vh;border-radius:28px;transform:translate(-50%,-46%) scale(.97);opacity:0;pointer-events:none;transition:transform .25s ease,opacity .2s ease;padding-bottom:22px}
  .sheet.on{transform:translate(-50%,-50%);opacity:1;pointer-events:auto}
  .sheet .grab{display:none}
  .toast{bottom:28px;left:calc(50% + 124px)}

}

@media (min-width:1024px) and (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .notes{border-color:#6d4a2e;background-color:#8c6540} }
@media (min-width:1024px){ :root[data-theme="dark"] .notes{border-color:#6d4a2e;background-color:#8c6540} }

/* Scelta dello stile: due anteprime in miniatura */
.stili{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:4px}
.stili button{display:flex;flex-direction:column;align-items:flex-start;gap:3px;text-align:left;padding:10px;border:2px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink)}
.stili button.on{border-color:var(--pink-d);background:var(--pink-l)}
.stili button small{font-size:11.5px;color:var(--ink2);line-height:1.3}
.stili .anteprima{display:flex;flex-direction:column;gap:5px;width:100%;height:58px;padding:8px;border-radius:8px;margin-bottom:4px}
.stili .anteprima i{display:block;height:10px;border-radius:3px}
.stile-quaderno .anteprima{background:#fffaf7 radial-gradient(circle,rgba(59,42,50,.18) 1px,transparent 1.3px) 0 0/9px 9px;border:1.5px solid rgba(59,42,50,.2)}
.stile-quaderno .anteprima i{background:#fff;border:1.2px solid rgba(59,42,50,.25);box-shadow:1px 1px 0 rgba(59,42,50,.2)}
.stile-quaderno .anteprima i:first-child{width:55%;background:none;border:0;box-shadow:none;border-bottom:3px solid var(--pink);border-radius:2px;height:9px}
.stile-quaderno b{font-family:'Patrick Hand',var(--ft);font-weight:400;font-size:19px}
.stile-morbido .anteprima{background:linear-gradient(160deg,#fff5f8,#ffe9f0)}
.stile-morbido .anteprima i{background:#fff;border-radius:99px;box-shadow:0 3px 8px rgba(232,93,138,.18)}
.stile-morbido .anteprima i:last-child{width:60%;background:linear-gradient(145deg,#ff8fb1,#e85d8a)}
.stile-morbido b{font-family:Fredoka,var(--ft);font-weight:600;font-size:16px}
/* Com'è andata la giornata */
.umore-card{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--card);border-radius:18px;padding:12px 14px;box-shadow:var(--shadow);margin:10px 0 0}
.umore-card .u-domanda{width:100%;font-family:var(--fh,var(--ft));font-size:18px;font-weight:600}
.umore-card.fatto .u-txt{flex:1;min-width:0}
.umore-card .u-txt b{display:block;font-size:15px}
.umore-card .u-txt small{display:block;color:var(--ink2);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.facce{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;width:100%}
.facce button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;border-radius:12px;border:2px solid transparent;background:none;color:var(--ink2)}
.facce button small{font-size:11px;font-weight:700;line-height:1.1;text-align:center}
.facce button:active svg{transform:scale(.9)}
.facce.grandi{margin-bottom:12px}
.facce.grandi button.on{border-color:var(--pink-d);background:var(--pink-l);color:var(--ink)}
.day.has-um::before{content:"";position:absolute;inset:12%;border-radius:50%;background:var(--um);opacity:.6}
.day .dn{position:relative}
.day.sel.has-um::before{opacity:.35;background:#fff}
.umore-riga{display:flex;align-items:center;gap:10px;width:100%;margin-top:12px;padding:10px 12px;border-radius:14px;background:var(--card);box-shadow:var(--shadow);text-align:left;color:var(--ink)}
.umore-riga b{display:block;font-size:14.5px}
.umore-riga small{display:block;color:var(--ink2);font-size:12.5px}
.umore-riga .pallino{width:30px;height:30px;border-radius:50%;border:2px dashed var(--line);flex:none}
.u-legenda{display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:10px;font-size:12px;color:var(--ink2);font-weight:700}
.u-legenda i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.giardino{display:block;width:100%;height:auto;border-radius:16px;box-shadow:var(--shadow)}
:root[data-stile="quaderno"] .umore-card,:root[data-stile="quaderno"] .umore-riga{border-radius:var(--r-paper);box-shadow:var(--edge);border:1.5px solid var(--ink-a)}
:root[data-stile="quaderno"] .umore-card .u-domanda{font-weight:400;font-size:22px}
/* Biscotto della fortuna */
.biscotto-wrap{position:fixed;inset:0;z-index:95;display:grid;place-items:center;padding:24px;background:rgba(74,47,58,.45);backdrop-filter:blur(3px);opacity:0;transition:opacity .3s}
.biscotto-wrap.on{opacity:1}
.biscotto-card{width:min(360px,100%);background:var(--card);border-radius:24px;padding:22px 20px 18px;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.25);transform:translateY(16px) scale(.96);transition:transform .35s cubic-bezier(.2,.9,.3,1.2)}
.biscotto-wrap.on .biscotto-card{transform:none}
.b-titolo{margin:0 0 4px;font-family:var(--fh,var(--ft));font-size:22px;color:var(--ink)}
.b-cookie{position:relative;display:block;width:220px;height:170px;margin:4px auto 0;border:0;background:none;padding:0;cursor:pointer}
.b-cookie svg{position:absolute;inset:16px 10px 0;width:200px;height:140px;overflow:visible}
.b-cookie .b-l,.b-cookie .b-r{transform-box:fill-box;transition:transform .6s cubic-bezier(.3,1.4,.5,1)}
.b-cookie .b-l{transform-origin:100% 40%}.b-cookie .b-r{transform-origin:0% 40%}
.biscotto-wrap.on:not(.aperto) .b-cookie svg{animation:biscottoDondola 2.4s ease-in-out infinite}
.aperto .b-cookie .b-l{transform:translate(-34px,14px) rotate(-24deg)}
.aperto .b-cookie .b-r{transform:translate(34px,14px) rotate(24deg)}
.b-carta{position:absolute;left:50%;top:58px;width:250px;max-width:84vw;transform:translateX(-50%) scaleX(.04);transform-origin:center;opacity:0;background:#fffdf7;color:#3b2a32;border:1px solid rgba(59,42,50,.18);border-radius:3px;padding:10px 14px;box-shadow:0 3px 0 rgba(59,42,50,.08);font-family:var(--fh,var(--fb));font-size:17px;line-height:1.35;transition:transform .55s .25s cubic-bezier(.2,.9,.3,1.1),opacity .2s .25s;z-index:2}
.b-carta::before,.b-carta::after{content:"";position:absolute;top:50%;width:6px;height:6px;margin-top:-3px;border-radius:50%;background:var(--pink)}
.b-carta::before{left:6px}.b-carta::after{right:6px}
.aperto .b-carta{transform:translateX(-50%) scaleX(1) translateY(-6px);opacity:1}
.b-hint{margin:2px 0 12px;font-size:13.5px;color:var(--ink2);transition:opacity .2s}
.aperto .b-hint{opacity:0;pointer-events:none}
.b-cookie:focus{outline:none}
.b-cookie:focus-visible{outline:3px solid var(--pink);outline-offset:4px;border-radius:18px}
.b-dopo{margin-top:6px;padding:4px 10px;background:none;color:var(--ink2);font-size:13px;text-decoration:underline;text-underline-offset:3px}
.b-azioni{opacity:0;pointer-events:none;transition:opacity .3s .7s}
.aperto .b-azioni{opacity:1;pointer-events:auto}

<!-- ============ LOGIN ============ -->
<div id="login" class="login hidden">
  <div class="box">
    <div class="mbox" id="loginMascot" data-act="poke"></div>
    <h1 class="fred" id="lTitle">Ciao!</h1>
    <p id="lSub">Custodisco le tue cose.<br>Entra per vederle.</p>
    <form id="loginForm" autocomplete="on">
      <input class="input hidden" id="lName" type="text" placeholder="Come ti chiami?" autocomplete="given-name" maxlength="40">
      <input class="input" id="lEmail" type="email" placeholder="Email" autocomplete="username">
      <div class="pw" id="lPassWrap">
        <input class="input" id="lPass" type="password" placeholder="Password" autocomplete="current-password" minlength="8">
        <button type="button" class="pw-eye" id="lEye" aria-label="Mostra password" aria-pressed="false"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/><path class="eye-off" d="M4 4l16 16"/></svg></button>
      </div>
      <label id="lPrivacyRow" class="hidden" style="display:flex;gap:8px;align-items:flex-start;text-align:left;font-size:13.5px;color:var(--ink2);margin:4px 2px 0">
        <input type="checkbox" id="lPrivacy" style="margin-top:3px;accent-color:var(--pink-d)">
        <span>Ho letto l'<a href="privacy.html" target="_blank" style="color:var(--pink-d);font-weight:800">informativa privacy</a></span>
      </label>
      <div class="err" id="lErr"></div>
      <button class="btn primary" style="width:100%" type="submit" id="lBtn">Entra</button>
    </form>
    <div style="margin-top:16px;display:flex;flex-direction:column;gap:8px;font-weight:800;font-size:14.5px">
      <button class="more" style="margin:0" id="lSwitch">Non hai un account? Creane uno</button>
      <button class="more" style="margin:0;color:var(--ink2)" id="lForgot">Password dimenticata?</button>
    </div>
  </div>
</div>

<!-- ============ APP ============ -->
<div id="app" class="app hidden">
  <header class="top">
    <button class="mascot" id="topMascot" data-act="poke" aria-label="Mascotte"></button>
    <div class="hello">
      <h1 id="hello">Ciao!</h1>
      <p id="today"></p>
      <button class="motto" id="motto" data-act="motto" title="Un'altra frase"></button>
    </div>
    <button class="iconbtn" data-act="open-recap" title="Recap del mese" aria-label="Recap del mese"><span class="emo">🎀</span><svg class="ico q" aria-hidden="true"><use href="#i-recapbtn"/></svg></button>
    <button class="iconbtn mob-only" data-tab="menu" title="Menu" aria-label="Menu"><span class="emo">☰</span><svg class="ico q" aria-hidden="true"><use href="#i-menu"/></svg></button>
    <button class="iconbtn desk-only-i" data-act="open-settings" title="Impostazioni" aria-label="Impostazioni"><span class="emo">⚙️</span><svg class="ico q" aria-hidden="true"><use href="#i-impostazioni"/></svg></button>
  </header>
  <main id="view"></main>
</div>

    <button class="side desk-only online-only" data-tab="liste"><span class="i"><span class="emo">👭</span><svg class="ico q" aria-hidden="true"><use href="#i-liste"/></svg></span>Liste condivise</button>
    <button class="side desk-only online-only" data-act="open-ricorrenti" data-tab="ricorrenti"><span class="i"><span class="emo">🔁</span><svg class="ico q" aria-hidden="true"><use href="#i-ricorrenti"/></svg></span>Ricorrenti</button>
    <button class="side desk-only" data-tab="turni"><span class="i"><span class="emo">💼</span><svg class="ico q" aria-hidden="true"><use href="#i-turni"/></svg></span>Turni di lavoro</button>

    <button class="side desk-only" data-act="giardino-apri"><span class="i"><span class="emo">🌷</span><svg class="ico q" aria-hidden="true"><use href="#i-fiore"/></svg></span>Il giardino del mese</button>
    <button class="side desk-only" data-act="open-biscotto"><span class="i"><span class="emo">🥠</span><svg class="ico q" aria-hidden="true"><use href="#i-biscotto"/></svg></span>Biscotto del giorno</button>
    <button class="side desk-only" data-act="open-pancino"><span class="i"><span class="emo">🍣</span><svg class="ico q" aria-hidden="true"><use href="#i-pancino"/></svg></span>Il pancino</button>
    <button class="side desk-only online-only" data-act="open-consiglio"><span class="i"><span class="emo">💌</span><svg class="ico q" aria-hidden="true"><use href="#i-consiglia"/></svg></span>Consiglia</button>
    <button class="side side-admin desk-only hidden" data-act="open-inbox"><span class="i"><span class="emo">📬</span><svg class="ico q" aria-hidden="true"><use href="#i-messaggi"/></svg></span>Messaggi ricevuti</button>
    <button class="side desk-only" data-act="open-settings"><span class="i"><span class="emo">⚙️</span><svg class="ico q" aria-hidden="true"><use href="#i-impostazioni"/></svg></span>Impostazioni</button>
  </div>

<div class="scrim" id="scrim"></div>
<section class="sheet" id="sheet" inert></section>
